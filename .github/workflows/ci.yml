name: Qualidade

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código
        uses: actions/checkout@v6
      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          package-manager-cache: true
      - name: Instalar dependências
        run: npm ci
      - name: Executar testes
        run: npm test
      - name: Verificar código
        run: npm run lint
      - name: Validar tipos
        run: npm run typecheck
      - name: Gerar versão de produção
        run: npm run build
